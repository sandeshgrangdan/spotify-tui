[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm"]
# Target platforms to build apps for (Rust target-triple syntax).
# aarch64-pc-windows-msvc is deliberately absent: dist has no native ARM64
# Windows runner by default, so it cross-compiles in the messense/cargo-xwin
# container, and ring's C sources (pulled in via rspotify -> reqwest -> rustls)
# fail to compile there. Windows on ARM runs the x86_64 build under emulation.
# To build it natively instead, add:
#   [dist.github-custom-runners]
#   aarch64-pc-windows-msvc = "windows-11-arm"
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# A namespace to use when publishing this package to the npm registry
npm-scope = "@sandeshgrangdan"
# Publish the npm package to the registry (needs an NPM_TOKEN repo secret)
publish-jobs = ["npm"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true

# `spotify-tui` as a second command name for the same binary (symlinked by the
# installers, so it costs no extra bytes in the archives).
[dist.bin-aliases]
spt = ["spotify-tui"]
