[package]
name = "spotify-tui"
# Not published to crates.io: the name belongs to upstream, and this fork is
# distributed through GitHub Releases and npm instead.
publish = false
description = "A terminal user interface for Spotify, with an app-like home screen. Fork of spotify-tui, modernized for the post-2024 Web API."
homepage = "https://github.com/sandeshgrangdan/spotify-tui"
documentation = "https://github.com/sandeshgrangdan/spotify-tui"
repository = "https://github.com/sandeshgrangdan/spotify-tui"
keywords = ["spotify", "tui", "cli", "terminal", "music"]
categories = ["command-line-utilities"]
# Continues the numbering of upstream spotify-tui, which stopped at 0.25.0.
version = "0.26.1"
authors = [
  "Sandesh Tamang",
  "Alexander Keliris <rigellute@gmail.com>",
]
edition = "2018"
license = "MIT OR Apache-2.0"
readme = "README.md"
# Screenshots, packaging and CI config aren't needed by `cargo install`, and the
# images alone are over a megabyte.
exclude = [
  "*.png",
  "snap/",
  ".github/",
  ".all-contributorsrc",
  "how_to_release.md",
  "docs/",
]

# `publish = false` above otherwise hides this package from dist, which would
# leave a release tag with no artifacts.
[package.metadata.dist]
dist = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rspotify = { version = "0.16", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
dirs = "5.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
unicode-width = "0.2"
backtrace = "0.3"
arboard = "3.4"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
anyhow = "1.0"
async-trait = "0.1"
webbrowser = "1.0"
chrono = "0.4"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1.0"

[[bin]]
bench = false
path = "src/main.rs"
name = "spt"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
